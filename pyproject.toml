[project]
name = "pythia-knowledge"
dynamic = ["version"]
description = "Personal knowledge oracle"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Edu Caribé" }]
keywords = ["llm", "memory", "knowledge-base", "mcp", "claude", "knowledge-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.13,<3.15"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "keyring>=25",
    "mcp>=1.10",
    "fastembed>=0.5",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/caribeedu/pythia"
Documentation = "https://github.com/caribeedu/pythia/tree/main/docs"
Issues = "https://github.com/caribeedu/pythia/issues"

[project.scripts]
pythia = "pythia.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pythia/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pythia"]

[tool.hatch.build.targets.wheel.force-include]
"docker-compose.yml" = "pythia/docker-compose.yml"

[tool.pytest.ini_options]
testpaths = ["tests"]
