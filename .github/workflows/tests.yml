name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: pythia
          POSTGRES_PASSWORD: pythia
          POSTGRES_DB: pythia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pythia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHIA_TEST_DATABASE_URL: postgresql://pythia:pythia@127.0.0.1:5432/pythia_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python -m pytest -q
